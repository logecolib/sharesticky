[package]
name = "sharesticky"
version = "0.1.0"
edition = "2021"

[lib]
name = "sharesticky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
# Rust now owns SQLite so it can be encrypted. bundled-sqlcipher-vendored-openssl
# compiles SQLCipher + OpenSSL from source (needs Strawberry Perl + a short build
# path on Windows — see memory: project_sqlcipher_build).
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
zeroize = "1"
hex = "0.4"
base64 = "0.22"
# iroh cannot be linked in-process: its (non-optional) wmi dependency collides
# with tauri's pinned windows 0.61.3 (see memory: project_iroh_sidecar). It runs
# as the standalone `net-sidecar` binary; the app speaks NDJSON to it over stdio.

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
